# Build Hugo docs and deploy to GitHub Pages (grainvm.com).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "api/openapi.yaml"
      - "api/openapi.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "api/openapi.yaml"
      - "api/openapi.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.4"
          extended: true

      # Issue #88: versioned docs paths without committing per-release trees.
      # Extract docs/main from each product tag into docs/content/docs/X.Y.Z/.
      - name: Materialize versioned docs from tags
        run: |
          set -euo pipefail
          chmod +x scripts/docs-materialize-versions.sh
          ./scripts/docs-materialize-versions.sh
          ls -la docs/content/docs/ | head -30

      - name: Build site
        working-directory: docs
        run: hugo --minify --gc

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
