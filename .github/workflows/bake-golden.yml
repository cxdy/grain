# Bake grain-ubuntu golden qcow2, upload as a workflow artifact, and publish
# to the dedicated GitHub Release tag `golden-latest` so:
#
#   grain image pull grain-ubuntu
#
# resolves to:
#   https://github.com/cxdy/grain/releases/download/golden-latest/grain-ubuntu-<arch>.qcow2
#
# Triggers:
#   - workflow_dispatch (manual): always updates golden-latest; optional release_tag
#     also attaches assets to an existing code release (e.g. v0.1.0)
#   - schedule: weekly (Monday 06:00 UTC)
#
# Arch notes:
#   - ubuntu-latest is amd64 only → produces grain-ubuntu-amd64.qcow2
#   - arm64 bake needs a self-hosted runner with QEMU/KVM (not matrixed here yet).
#     Future: matrix include { runs-on: [self-hosted, linux, arm64], arch: arm64 }
#     with labels matching your runner; publish grain-ubuntu-arm64.qcow2(+.sha256)
#     alongside amd64 on the same golden-latest tag (softprops overwrites assets).
#
# KVM: GitHub-hosted runners often lack /dev/kvm. grain QEMU uses -cpu host, so
# the job may fail without nested virt. Prefer self-hosted + KVM, or bake locally
# (./scripts/ci-bake-golden.sh / bake-golden.sh --ci) and import the artifact.
name: Bake golden image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing git tag to also attach qcow2 + checksum to (e.g. v0.1.0). Empty = golden-latest only."
        required: false
        type: string
        default: ""
      # Future: when arm64 self-hosted runners are available, dispatch may select
      # target arch or matrix both. Today this job is amd64-only on ubuntu-latest.
      # arch:
      #   description: "Target arch (amd64 now; arm64 needs self-hosted KVM runner)"
      #   required: false
      #   type: choice
      #   options: [amd64, arm64]
      #   default: amd64
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: write # create/update golden-latest release assets

jobs:
  bake:
    name: bake grain-ubuntu (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install QEMU + OVMF + ISO tools
        run: |
          sudo apt-get update -qq
          # OVMF: Ubuntu cloud images need UEFI. genisoimage/xorriso: cloud-init seed on Linux.
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf genisoimage
          qemu-system-x86_64 --version | head -1
          qemu-img --version | head -1
          ls -la /usr/share/OVMF/ 2>/dev/null | head -20 || true
          if [[ -e /dev/kvm ]]; then
            echo "KVM: /dev/kvm present"
            ls -l /dev/kvm
            sudo chmod 666 /dev/kvm 2>/dev/null || true
          else
            echo "::warning::/dev/kvm missing — bake may be slow (TCG) or fail. See docs/images.md"
          fi

      - name: Build grain + agent-linux
        run: make build agent-linux

      - name: Headless golden bake
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/dist/golden
          CI_READY_TIMEOUT: 15m
        run: |
          chmod +x scripts/bake-golden.sh scripts/ci-bake-golden.sh
          ./scripts/ci-bake-golden.sh

      - name: List artifacts
        if: always()
        run: |
          ls -lah dist/golden/ 2>/dev/null || echo "no dist/golden yet"
          if [[ -f dist/golden/grain-ubuntu-amd64.qcow2 ]]; then
            qemu-img info dist/golden/grain-ubuntu-amd64.qcow2 || true
          fi

      - name: Upload qcow2 + checksum
        uses: actions/upload-artifact@v4
        with:
          name: grain-ubuntu-amd64
          path: |
            dist/golden/grain-ubuntu-amd64.qcow2
            dist/golden/grain-ubuntu-amd64.qcow2.sha256
          if-no-files-found: error
          retention-days: 30

      # Always publish/update the movable golden-latest release so catalog pull works.
      # make_latest: false keeps code tags (v*) as the repo "latest" release.
      # fail_on_unmatched_files: true ensures we never publish a partial/empty release.
      # Re-running this step replaces existing assets with the same names on the tag.
      - name: Publish golden-latest release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: golden-latest
          name: Golden images (latest)
          body: |
            Pre-baked **grain-ubuntu** golden disk images (Ubuntu + grain-agent).

            ```bash
            grain image pull grain-ubuntu
            grain new -i grain-ubuntu
            ```

            | Asset | Arch |
            |-------|------|
            | `grain-ubuntu-amd64.qcow2` | x86_64 (this workflow on `ubuntu-latest`) |
            | `grain-ubuntu-arm64.qcow2` | aarch64 (self-hosted bake; not yet matrixed) |

            Companion `.sha256` sidecars are verified by `grain image pull` when present.

            This tag is rewritten on every successful bake (schedule / workflow_dispatch).
            It is **not** a code release — use `v*` tags for binaries.
          files: |
            dist/golden/grain-ubuntu-amd64.qcow2
            dist/golden/grain-ubuntu-amd64.qcow2.sha256
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: also attach to an existing code GitHub Release when dispatch provides release_tag.
      - name: Attach to code release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/golden/grain-ubuntu-amd64.qcow2
            dist/golden/grain-ubuntu-amd64.qcow2.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
