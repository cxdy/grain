# Scaffold: Firecracker kernel + raw rootfs bake (Phase 1).
# Full bake is not implemented yet — this workflow documents the contract and
# runs scripts/bake-fc.sh --ci (dry-run / prereq scan). When bake lands, this
# job will produce dist/fc/* and publish to the fc-latest release tag
# (see internal/image fcReleaseBase), mirroring bake-golden.yml.
name: Bake Firecracker artifacts

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note (scaffold only; full bake not wired)"
        required: false
        type: string
        default: ""

# No contents: write yet — publishing enables when real artifacts exist.
permissions:
  contents: read

jobs:
  scaffold:
    name: bake-fc scaffold (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bake-fc dry-run
        run: |
          chmod +x scripts/bake-fc.sh
          ./scripts/bake-fc.sh --ci
          echo "Planned assets: grain-ubuntu-fc-<arch>.raw + vmlinux-<arch> (+ .sha256) on tag fc-latest"
