# Firecracker kernel + raw rootfs bake (Phase 1).
# Produces dist/fc/* via scripts/bake-fc.sh --all (download FC CI kernel/rootfs,
# inject static grain-agent). Publish to fc-latest is a follow-up (contents:write).
# Note: GitHub-hosted runners usually lack /dev/kvm; this job only builds artifacts
# (no microVM smoke). Nested-KVM smoke stays on self-hosted / manual.
name: Bake Firecracker artifacts

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bake:
    name: bake-fc (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools qemu-utils e2fsprogs curl

      - name: Bake kernel + rootfs
        run: |
          chmod +x scripts/bake-fc.sh
          ./scripts/bake-fc.sh --all
          ls -lh dist/fc/
          cat dist/fc/*.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grain-fc-amd64
          path: dist/fc/*
          if-no-files-found: error
