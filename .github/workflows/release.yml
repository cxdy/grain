name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-build binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CGO_ENABLED: "0"
        run: make release-build

      - name: Checksums
        working-directory: dist
        run: sha256sum grain_* grain-agent-linux-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/grain_darwin_arm64
            dist/grain_darwin_amd64
            dist/grain_linux_arm64
            dist/grain_linux_amd64
            dist/grain-agent-linux-arm64
            dist/grain-agent-linux-amd64
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
