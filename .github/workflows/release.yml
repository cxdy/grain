# Cross-build CLI + guest agent and publish a GitHub Release (GoReleaser).
# Tag push (v*) → goreleaser-action → archives + checksums + notes.
#
# Golden qcow2 images stay on the separate "Bake golden image" workflow
# (tag golden-latest), not this release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
