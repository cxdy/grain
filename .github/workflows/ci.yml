name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Same-repo PRs: post the cobertura table as a PR comment from this job.
# Fork PRs: GITHUB_TOKEN is read-only here; coverage-comment.yml (workflow_run)
# posts the comment with a base-repo token after downloading the artifact.
permissions:
  contents: read
  pull-requests: write
  issues: write # PR comments use the issues comments API
  checks: write # cobertura-action also creates a check run

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: extractions/setup-just@v3

      - name: Unit tests
        run: just test

      - name: Smoke API (mock hypervisor)
        run: just smoke-api

      - name: Coverage
        run: just coverage

      # Same-repo PRs: post the coverage table as a PR comment.
      # Keep the body small: full missing-line link dumps exceed GitHub's
      # comment size limit and the API returns "Invalid request".
      - name: Coverage PR comment
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: 5monkeys/cobertura-action@v14
        env:
          # Action still ships Node 20; allow until upstream moves to Node 24.
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          report_name: coverage
          path: coverage.xml
          minimum_coverage: 75
          fail_below_threshold: false
          skip_covered: true
          show_line: true
          show_branch: false
          show_class_names: false
          show_missing: true
          show_missing_max_length: 80
          link_missing_lines: false
          only_changed_files: false

      # Artifact for fork PRs (consumed by coverage-comment.yml via workflow_run).
      - name: Prepare coverage artifact
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo -n "${{ github.event.pull_request.number }}" > pr-number.txt
          test -s pr-number.txt
          test -f coverage.xml

      - name: Upload coverage report
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            pr-number.txt
          retention-days: 5
          if-no-files-found: error

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
