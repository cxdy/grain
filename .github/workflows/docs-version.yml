# Safety net: after a GitHub Release is published, refresh Hugo docs switcher
# metadata (live tree label + product SVU tag→commit list). Does NOT snapshot
# per-release content trees (issue #88).
# Prefer `just release-tag`, which bumps docs before tagging; this catches
# hand-cut tags and forgotten bumps.
name: Docs version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without or with v (e.g. 0.3.1 or v0.3.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${{ github.event.release.tag_name }}"
          fi
          VER="${RAW#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Skipping non-semver / non-product tag: $RAW"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip non-product release tags (fc/golden/sdk/guest-agent).
          case "$RAW" in
            fc-*|golden-*|sdk-*|*guest-agent*|agent-*)
              echo "Skipping non-product tag: $RAW"
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "version=$VER" >>"$GITHUB_OUTPUT"
          echo "tag=v$VER" >>"$GITHUB_OUTPUT"
          echo "skip=false" >>"$GITHUB_OUTPUT"

      - name: Checkout main
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump docs version metadata
        if: steps.ver.outputs.skip != 'true'
        run: ./scripts/docs-version-bump.sh "${{ steps.ver.outputs.version }}"

      - name: Open PR if main still needs the bump
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          BRANCH="docs/version-v${VER}"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "docs already at v${VER} on main — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/hugo.toml
          git add -u docs/hugo.toml || true
          git commit -m "docs: publish v${VER} site version"
          git push -u origin "$BRANCH" --force
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH"
            gh pr view "$BRANCH" --web || true
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs: publish v${VER} site version" \
              --body "$(cat <<EOF
          ## Summary
          Automated docs version metadata bump for **v${VER}** (release safety net).

          - Live content remains \`docs/content/docs/main/\` → \`/docs/main/\`
          - Version switcher label **v${VER} (latest)** + product SVU tags as GitHub commit links
          - No per-release content snapshot (issue #88)

          Prefer cutting releases with \`just release-tag\`.

          ## Test plan
          - [ ] Version switcher shows v${VER} (latest) for live docs
          - [ ] Historical versions open GitHub at the tag commit
          - [ ] No \`docs/content/docs/${VER}/\` tree on main
          - [ ] Pages deploy succeeds after merge
          EOF
          )"
          fi
