# Lightweight Python tooling bootstrap.
#
#   grain new --recipe python-dev
#
apiVersion: grain/v1
kind: Sandbox
metadata:
  name: python-dev
  description: Ubuntu with python3, pip, venv, and git ready
spec:
  image: grain-ubuntu
  cpus: 2
  memory_mb: 4096
  disk_gb: 20
  ready_timeout: 12m
  mounts:
    - host: .
      guest: /work
  bootstrap:
    ready_name: python-dev
    steps:
      - name: packages
        message: installing python tooling
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv git curl ca-certificates
