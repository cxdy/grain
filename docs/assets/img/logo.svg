  <path
    fill="url(#shine)"
    d="M28 16.5c4.2-1.8 9.6-.6 12.4 3.1 1.6 2.1 2 4.8 1.1 7.2-.9 2.4-3.1 4.1-5.6 4.5-3.8.6-7.6-1.8-8.9-5.4-1.2-3.2.2-7.3 1-9.4z"
    opacity="0.55"/>
  <!-- tiny facet sparkle -->
  <circle cx="38.5" cy="24" r="1.6" fill="#FFF9EC" opacity="0.85"/>
</svg>
