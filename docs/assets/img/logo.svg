<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="grain">
  <defs>
    <linearGradient id="g" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2E6C8"/>
      <stop offset="0.45" stop-color="#E2C98A"/>
      <stop offset="1" stop-color="#3DDEA8"/>
    </linearGradient>
    <linearGradient id="shine" x1="22" y1="16" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF8E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- single grain of sand: small, whole, slightly irregular -->
  <path
