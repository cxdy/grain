# grain documentation site (Hugo)
baseURL = "https://grainvm.com/"
title = "grain"
defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 1
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 30
paginate = 20

# UglyURLs false → pretty directories
[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # allow raw HTML in content (homepage/demo embeds)
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = false   # class-based tokens; theme via chroma.css light/dark
    codeFences = true
    guessSyntax = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "Linux microVM sandboxes on your own hardware — shells, GitHub Actions, and k3s labs."
  github = "https://github.com/cxdy/grain"
  # Live docs path slug (single content tree: docs/content/docs/main/).
  docsVersion = "main"
  # Product label for the live site (updated by scripts/docs-version-bump.sh).
  docsVersionLabel = "v0.8.0"
  # Git commit for the latest product release tag (homepage/marketing fallback).
  docsVersionCommit = "6c8f68ca49a08e0d2a61efe3b57428bf3a9fed6b"
  # Version dropdown: live site + product SVU tags as GitHub commit links.
  # No per-release content copies under docs/content/docs/ (issue #88).
  # Non-product tags (fc-*, golden-*, sdk-*, guest-agent) are excluded.
  [[params.docsVersions]]
    version = "main"
    label = "v0.8.0 (latest)"
    path = "/docs/main/"
    live = true
    commit = "6c8f68ca49a08e0d2a61efe3b57428bf3a9fed6b"
