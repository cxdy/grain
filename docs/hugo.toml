# grain documentation site (Hugo)
baseURL = "https://grainvm.com/"
title = "grain"
defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 1
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 30
paginate = 20

# UglyURLs false → pretty directories
[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # allow raw HTML in content (homepage/demo embeds)
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = false   # class-based tokens; theme via chroma.css light/dark
    codeFences = true
    guessSyntax = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "Linux microVM sandboxes on your own hardware — shells, GitHub Actions, and k3s labs."
  github = "https://github.com/cxdy/grain"
  # Current *released* docs version (patch path).
  docsVersion = "0.6.1"
  docsVersionLabel = "v0.6.1"
  # Shown in version dropdown; CI will extend with more releases later.
  [[params.docsVersions]]
    version = "0.6.1"
    label = "v0.6.1 (latest)"
    path = "/docs/0.6.1/"
  [[params.docsVersions]]
    version = "0.6.0"
    label = "v0.6.0"
    path = "/docs/0.6.0/"
  [[params.docsVersions]]
    version = "0.5.0"
    label = "v0.5.0"
    path = "/docs/0.5.0/"
  [[params.docsVersions]]
    version = "0.4.0"
    label = "v0.4.0"
    path = "/docs/0.4.0/"
  [[params.docsVersions]]
    version = "0.3.0"
    label = "v0.3.0"
    path = "/docs/0.3.0/"
  [[params.docsVersions]]
    version = "0.2.2"
    label = "v0.2.2"
    path = "/docs/0.2.2/"
  [[params.docsVersions]]
    version = "main"
    label = "main (bleeding edge)"
    path = "/docs/main/"

  brand = "grain"

