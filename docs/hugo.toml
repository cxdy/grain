# grain documentation site (Hugo)
baseURL = "https://grainvm.com/"
title = "grain"
defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 1
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 30
paginate = 20

# UglyURLs false → pretty directories
[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # allow raw HTML in content (homepage/demo embeds)
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = false   # class-based tokens; theme via chroma.css light/dark
    codeFences = true
    guessSyntax = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  description = "Linux microVM sandboxes on your own hardware — shells, GitHub Actions, and k3s labs."
  github = "https://github.com/cxdy/grain"
  # Current *released* docs version (patch path).
  docsVersion = "0.7.0"
  docsVersionLabel = "v0.7.0"
  # Git commit for the default docs version (tag v0.6.3). Prefer per-entry
  # commit below; this is the homepage/marketing fallback.
  docsVersionCommit = "ddce19b3bb772a7397f694a0ed615a6b2f40c684"
  # Shown in version dropdown. Each entry may include `commit` (full SHA of
  # the release tag / branch tip) so the UI can link to source without keeping
  # full content trees as the long-term model (see scripts/docs-version-bump.sh).
  [[params.docsVersions]]
    version = "0.7.0"
    label = "v0.7.0 (latest)"
    path = "/docs/0.7.0/"
    commit = "ddce19b3bb772a7397f694a0ed615a6b2f40c684"
