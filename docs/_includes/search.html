<button type="button" class="search-open" id="site-search-open" aria-label="Search documentation" title="Search (⌘K)">
  <span class="search-open-icon" aria-hidden="true">⌕</span>
  <span class="search-open-label">Search</span>
  <kbd class="search-kbd">⌘K</kbd>
</button>

<div class="search-backdrop" id="site-search-backdrop" hidden></div>
<div class="search-panel" id="site-search-panel" role="dialog" aria-modal="true" aria-label="Search documentation" hidden>
  <div class="search-panel-inner">
    <div class="search-input-row">
      <span class="search-input-icon" aria-hidden="true">⌕</span>
      <input
        type="search"
        id="site-search-input"
        class="search-input"
        placeholder="Search docs…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        aria-controls="site-search-results"
      />
      <kbd class="search-kbd">esc</kbd>
    </div>
    <div class="search-results" id="site-search-results" role="listbox">
      <p class="search-hint">Search guides, reference, and SDKs…</p>
    </div>
  </div>
</div>
