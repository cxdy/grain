<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/img/logo.svg' | relative_url }}" width="28" height="28" alt="" />
      <span class="brand-name">grain</span>
    </a>
    <nav class="nav-main" aria-label="Primary">
      {% for item in site.nav %}
        {% if item.external %}
          <a href="{{ item.url }}" rel="noopener" target="_blank">{{ item.title }}</a>
        {% else %}
          {% assign is_current = false %}
          {% if item.url != '/' and page.url contains item.url %}{% assign is_current = true %}{% endif %}
          <a href="{{ item.url | relative_url }}" {% if is_current %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endif %}
      {% endfor %}
    </nav>
    <div class="header-actions">
      {% include search.html %}
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">
        <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
        <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
      </button>
      <a class="btn btn-sm btn-primary" href="{{ '/get-started/install/' | relative_url }}">Install</a>
    </div>
  </div>
</header>
