<section class="sandbox-demo" id="demo" data-sandbox-demo aria-label="Interactive grain demo">
  <div class="demo-chrome">
    <div class="demo-chrome-dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="demo-chrome-title" data-demo-title>~ — grain — interactive demo</div>
    <div class="demo-chrome-actions">
      <button type="button" class="demo-btn" data-demo-restart title="Restart demo">↻</button>
    </div>
  </div>

  <div class="demo-scenarios" data-demo-scenarios role="tablist" aria-label="Demo scenario"></div>
  <p class="demo-blurb" data-demo-blurb></p>

  <div class="demo-body">
    <div class="demo-term-wrap">
      <div class="demo-term" data-demo-term tabindex="0" role="log" aria-live="polite" aria-relevant="additions">
        <div class="demo-term-scroll" data-demo-output></div>
        <div class="demo-input-line" data-demo-input-line>
          <span class="demo-prompt" data-demo-prompt>$</span>
          <span class="demo-ghost" data-demo-ghost aria-hidden="true"></span>
          <input type="text" class="demo-input" data-demo-input autocomplete="off" spellcheck="false" aria-label="Demo terminal input" />
        </div>
      </div>
    </div>
    <aside class="demo-sidebar">
      <p class="demo-sidebar-label">Walkthrough</p>
      <ul class="demo-steps" data-demo-steps></ul>
      <p class="demo-hint" data-demo-hint></p>
      <div class="demo-controls">
        <button type="button" class="demo-ctrl demo-ctrl-ghost" data-demo-skip>Skip</button>
        <button type="button" class="demo-ctrl demo-ctrl-primary" data-demo-next>Run step →</button>
      </div>
      <p class="demo-footnote">Simulated terminal — nothing runs on your machine. <a href="{{ '/get-started/quickstart/' | relative_url }}">Install for real →</a></p>
    </aside>
  </div>
</section>
