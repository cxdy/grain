<aside class="docs-sidebar" aria-label="Documentation">
  {% for section in site.docs_nav %}
    {% assign sec = section[1] %}
    <div class="sidebar-group">
      <h3>{{ sec.title }}</h3>
      <ul>
        {% for link in sec.links %}
          <li>
            <a href="{{ link.url | relative_url }}"
               {% if page.url == link.url or page.url == link.url | append: 'index.html' %}aria-current="page"{% endif %}
               {% if page.url contains link.url and link.url != '/guides/' %}class="active"{% endif %}
               {% if page.url == '/guides/' and link.url == '/guides/' %}class="active"{% endif %}>
              {{ link.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% endfor %}
</aside>
