title: grain
description: Linux microVM sandboxes on your own hardware — shells, GitHub Actions, and k3s labs.
url: https://grainvm.com
baseurl: ""
# Site / product version shown in the footer and docs chrome.
version: "0.2.2"


markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

permalink: pretty
# Keep CNAME in the site root for grainvm.com custom domain.
# RELEASE.md is maintainer-facing (GitHub); not a Jekyll docs page.
exclude:
  - RELEASE.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "get-started"
    values:
      layout: docs
      section: get-started
  - scope:
      path: "guides"
    values:
      layout: docs
      section: guides
  - scope:
      path: "reference"
    values:
      layout: docs
      section: reference
  - scope:
      path: "explain"
    values:
      layout: docs
      section: explain
  - scope:
      path: "developer"
    values:
      layout: docs
      section: get-started

nav:
  - title: Get started
    url: /get-started/quickstart/
  - title: act
    url: /guides/recipes/act/
  - title: k3s
    url: /guides/recipes/k3s/
  - title: Guides
    url: /guides/
  - title: Reference
    url: /reference/cli/
  - title: API
    url: /reference/openapi/
  - title: GitHub
    url: https://github.com/cxdy/grain
    external: true

