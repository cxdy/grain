title: grain
description: Fast Linux microVM sandboxes on your own hardware
url: https://grainvm.com
baseurl: ""


markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

permalink: pretty
# Keep CNAME in the site root for grainvm.com custom domain.
# RELEASE.md is maintainer-facing (GitHub); not a Jekyll docs page.
exclude:
  - RELEASE.md

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "get-started"
    values:
      layout: docs
      section: get-started
  - scope:
      path: "guides"
    values:
      layout: docs
      section: guides
  - scope:
      path: "reference"
    values:
      layout: docs
      section: reference
  - scope:
      path: "explain"
    values:
      layout: docs
      section: explain
  - scope:
      path: "developer"
    values:
      layout: docs
      section: get-started

nav:
  - title: Get started
    url: /get-started/quickstart/
  - title: act
    url: /guides/recipes/act/
  - title: k3s
    url: /guides/recipes/k3s/
  - title: Guides
    url: /guides/
  - title: Reference
    url: /reference/cli/
  - title: GitHub
    url: https://github.com/cxdy/grain
    external: true

