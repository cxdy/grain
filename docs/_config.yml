title: grain
description: Fast Linux microVM sandboxes on your own hardware
url: https://grainvm.com
baseurl: ""


markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

permalink: pretty
# Keep CNAME in the site root for grainvm.com custom domain.
exclude: []

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "get-started"
    values:
      layout: docs
      section: get-started
  - scope:
      path: "guides"
    values:
      layout: docs
      section: guides
  - scope:
      path: "reference"
    values:
      layout: docs
      section: reference
  - scope:
      path: "explain"
    values:
      layout: docs
      section: explain

nav:
  - title: Get started
    url: /get-started/install/
  - title: Guides
    url: /guides/
  - title: Reference
    url: /reference/cli/
  - title: Explain
    url: /explain/architecture/
  - title: GitHub
    url: https://github.com/cxdy/grain
    external: true

