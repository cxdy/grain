<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="layout-docs">
  {% include nav.html %}
  <div class="docs-shell wrap">
    {% include docs-sidebar.html %}
    <article class="docs-content prose">
      {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
      {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
      {{ content }}
    </article>
  </div>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
