<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="layout-docs" data-search-index="{{ '/search-data.json' | relative_url }}">
  {% include nav.html %}
  <div class="docs-shell wrap">
    {% include docs-sidebar.html %}
    <article class="docs-content prose">
      {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
      {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
      {{ content }}
    </article>
  </div>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  {% if page.sandbox_demo %}
  <script src="{{ '/assets/js/sandbox-demo.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
