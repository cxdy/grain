<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" crossorigin="anonymous">
  <style>
    /* Swagger UI on grain ink/mint chrome — theme-aware contrast */
    body.layout-openapi {
      background: var(--bg);
      color: var(--text);
    }
    .openapi-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
    }
    .openapi-intro {
      margin: 0 0 1.25rem;
    }
    .openapi-intro h1 {
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.85rem;
      margin: 0 0 0.4rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .openapi-intro .lead {
      color: var(--muted);
      margin: 0 0 0.75rem;
      max-width: 52rem;
    }
    .openapi-intro .openapi-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1.25rem;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .openapi-intro a {
      color: var(--brand-dim);
    }
    [data-theme="dark"] .openapi-intro a {
      color: var(--brand);
    }
    #swagger-ui {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* Base: inherit site type + force readable body text */
    #swagger-ui .swagger-ui {
      font-family: var(--font);
      color: var(--text);
    }
    #swagger-ui .swagger-ui .topbar { display: none; }
    #swagger-ui .swagger-ui .wrapper {
      padding: 0 1rem 1.5rem;
      max-width: none;
    }

    /* ---- Shared structure ---- */
    #swagger-ui .swagger-ui .info { margin: 1.25rem 0; }
    #swagger-ui .swagger-ui .info .title {
      font-family: var(--display);
      color: var(--text);
    }
    #swagger-ui .swagger-ui .info .title small {
      background: var(--brand-soft);
      color: var(--brand-dim);
    }
    [data-theme="dark"] #swagger-ui .swagger-ui .info .title small {
      color: var(--brand);
    }
    #swagger-ui .swagger-ui .info p,
    #swagger-ui .swagger-ui .info li,
    #swagger-ui .swagger-ui .info table,
    #swagger-ui .swagger-ui .markdown p,
    #swagger-ui .swagger-ui .markdown li,
    #swagger-ui .swagger-ui .renderedMarkdown p,
    #swagger-ui .swagger-ui .renderedMarkdown li {
      color: var(--text);
    }
    #swagger-ui .swagger-ui a.nostyle,
    #swagger-ui .swagger-ui .info a,
    #swagger-ui .swagger-ui .markdown a {
      color: var(--brand-dim);
    }
    [data-theme="dark"] #swagger-ui .swagger-ui a.nostyle,
    [data-theme="dark"] #swagger-ui .swagger-ui .info a,
    [data-theme="dark"] #swagger-ui .swagger-ui .markdown a {
      color: var(--brand);
    }

    #swagger-ui .swagger-ui .scheme-container {
      background: var(--bg-soft);
      box-shadow: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    #swagger-ui .swagger-ui .opblock-tag {
      border-bottom-color: var(--border);
      color: var(--text) !important;
    }
    #swagger-ui .swagger-ui .opblock-tag small {
      color: var(--muted) !important;
    }
    #swagger-ui .swagger-ui .opblock {
      border-radius: var(--radius);
      box-shadow: none;
      border: 1px solid var(--border);
      background: var(--bg-soft);
    }
    #swagger-ui .swagger-ui .opblock .opblock-summary {
      border-color: transparent;
    }
    #swagger-ui .swagger-ui .opblock .opblock-summary-method {
      font-family: var(--mono);
    }
    #swagger-ui .swagger-ui .opblock .opblock-summary-path,
    #swagger-ui .swagger-ui .opblock .opblock-summary-path__deprecated {
      color: var(--text) !important;
    }
    #swagger-ui .swagger-ui .opblock .opblock-summary-description {
      color: var(--muted) !important;
    }
    #swagger-ui .swagger-ui .opblock .opblock-section-header {
      background: var(--bg-elev);
      box-shadow: none;
      border-color: var(--border);
      color: var(--text);
    }
    #swagger-ui .swagger-ui .opblock .opblock-section-header h4,
    #swagger-ui .swagger-ui .opblock .opblock-section-header label {
      color: var(--text) !important;
    }

    /* Method tints */
    #swagger-ui .swagger-ui .opblock.opblock-get {
      border-color: color-mix(in srgb, #3b82f6 45%, var(--border));
      background: color-mix(in srgb, #3b82f6 10%, var(--bg-elev));
    }
    #swagger-ui .swagger-ui .opblock.opblock-post {
      border-color: color-mix(in srgb, var(--brand) 45%, var(--border));
      background: color-mix(in srgb, var(--brand) 10%, var(--bg-elev));
    }
    #swagger-ui .swagger-ui .opblock.opblock-put {
      border-color: color-mix(in srgb, #f59e0b 45%, var(--border));
      background: color-mix(in srgb, #f59e0b 10%, var(--bg-elev));
    }
    #swagger-ui .swagger-ui .opblock.opblock-delete {
      border-color: color-mix(in srgb, var(--danger) 45%, var(--border));
      background: color-mix(in srgb, var(--danger) 10%, var(--bg-elev));
    }

    /* Parameters / responses chrome */
    #swagger-ui .swagger-ui .tab li,
    #swagger-ui .swagger-ui .tab li button,
    #swagger-ui .swagger-ui .opblock-description-wrapper p,
    #swagger-ui .swagger-ui .opblock-external-docs-wrapper p,
    #swagger-ui .swagger-ui .opblock-title_normal,
    #swagger-ui .swagger-ui .response-col_status,
    #swagger-ui .swagger-ui .response-col_description,
    #swagger-ui .swagger-ui .response-col_links,
    #swagger-ui .swagger-ui table thead tr td,
    #swagger-ui .swagger-ui table thead tr th,
    #swagger-ui .swagger-ui .parameter__name,
    #swagger-ui .swagger-ui .parameter__type,
    #swagger-ui .swagger-ui .parameter__in,
    #swagger-ui .swagger-ui .parameter__deprecated,
    #swagger-ui .swagger-ui .response-control-media-type__accept-message,
    #swagger-ui .swagger-ui .responses-header td,
    #swagger-ui .swagger-ui .responses-inner h4,
    #swagger-ui .swagger-ui .responses-inner h5,
    #swagger-ui .swagger-ui .responses-inner h6,
    #swagger-ui .swagger-ui label,
    #swagger-ui .swagger-ui .btn,
    #swagger-ui .swagger-ui select,
    #swagger-ui .swagger-ui .model-title,
    #swagger-ui .swagger-ui .model,
    #swagger-ui .swagger-ui section.models h4,
    #swagger-ui .swagger-ui .loading-container,
    #swagger-ui .swagger-ui .errors-wrapper h4 {
      color: var(--text) !important;
      font-family: var(--font);
    }
    #swagger-ui .swagger-ui .parameter__type,
    #swagger-ui .swagger-ui .parameter__in,
    #swagger-ui .swagger-ui .response-col_links,
    #swagger-ui .swagger-ui .opblock-summary-description {
      color: var(--muted) !important;
    }
    #swagger-ui .swagger-ui .tab li {
      color: var(--muted) !important;
    }
    #swagger-ui .swagger-ui .tab li.active,
    #swagger-ui .swagger-ui .tab li.active button {
      color: var(--text) !important;
    }
    #swagger-ui .swagger-ui .opblock-body pre.example,
    #swagger-ui .swagger-ui .request-url,
    #swagger-ui .swagger-ui .request-url pre {
      color: var(--text) !important;
      background: var(--bg-soft) !important;
    }

    /* Code / curl blocks — contrast fixed per theme */
    #swagger-ui .swagger-ui .opblock-body pre.microlight,
    #swagger-ui .swagger-ui .highlight-code > .microlight,
    #swagger-ui .swagger-ui .curl-command,
    #swagger-ui .swagger-ui .curl {
      background: var(--code-bg) !important;
      color: var(--text) !important;
      font-family: var(--mono) !important;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    /* Flatten highlighter token colors so they don't fight the bg */
    [data-theme="light"] #swagger-ui .swagger-ui .microlight,
    [data-theme="light"] #swagger-ui .swagger-ui .microlight span,
    [data-theme="light"] #swagger-ui .swagger-ui .curl-command,
    [data-theme="light"] #swagger-ui .swagger-ui .curl-command span {
      color: #1a2330 !important;
      background: transparent !important;
    }
    [data-theme="dark"] #swagger-ui .swagger-ui .microlight,
    [data-theme="dark"] #swagger-ui .swagger-ui .microlight span,
    [data-theme="dark"] #swagger-ui .swagger-ui .curl-command,
    [data-theme="dark"] #swagger-ui .swagger-ui .curl-command span {
      color: #e6edf5 !important;
      background: transparent !important;
    }

    #swagger-ui .swagger-ui input[type=text],
    #swagger-ui .swagger-ui input[type=password],
    #swagger-ui .swagger-ui input[type=search],
    #swagger-ui .swagger-ui input[type=email],
    #swagger-ui .swagger-ui input[type=file],
    #swagger-ui .swagger-ui textarea,
    #swagger-ui .swagger-ui select {
      background: var(--bg) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: var(--radius);
    }
    #swagger-ui .swagger-ui .btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      box-shadow: none;
      border-radius: var(--radius);
      color: var(--text) !important;
    }
    #swagger-ui .swagger-ui .btn.execute {
      background: var(--brand) !important;
      border-color: var(--brand-dim) !important;
      color: #04120c !important;
      font-weight: 600;
    }
    #swagger-ui .swagger-ui .btn.authorize {
      color: var(--brand-dim) !important;
      border-color: var(--brand-dim) !important;
      background: transparent !important;
    }
    [data-theme="dark"] #swagger-ui .swagger-ui .btn.authorize {
      color: var(--brand) !important;
      border-color: var(--brand) !important;
    }
    #swagger-ui .swagger-ui .btn.cancel {
      color: var(--text) !important;
    }
    #swagger-ui .swagger-ui section.models {
      border: 1px solid var(--border);
      background: var(--bg-soft);
    }
    #swagger-ui .swagger-ui .model-box {
      background: transparent;
    }
    #swagger-ui .swagger-ui .markdown code,
    #swagger-ui .swagger-ui .renderedMarkdown code {
      background: var(--code-bg);
      color: var(--text);
      font-family: var(--mono);
      border: 1px solid var(--border);
    }

    /* Light-mode: dial back pastel GET panel so body text stays dark-on-light */
    [data-theme="light"] #swagger-ui .swagger-ui .opblock.opblock-get {
      background: #f0f6fc;
      border-color: #b6d0ea;
    }
    [data-theme="light"] #swagger-ui .swagger-ui .opblock.opblock-get .tab-header,
    [data-theme="light"] #swagger-ui .swagger-ui .opblock.opblock-get .opblock-section-header {
      background: #e8f1fa;
    }
    [data-theme="light"] #swagger-ui .swagger-ui .opblock-body,
    [data-theme="light"] #swagger-ui .swagger-ui .opblock-body * {
      /* children re-set intentionally below; keep inherited text dark */
    }
    [data-theme="light"] #swagger-ui .swagger-ui .responses-wrapper,
    [data-theme="light"] #swagger-ui .swagger-ui .parameters-container {
      color: #121820;
    }
    [data-theme="light"] #swagger-ui .swagger-ui .response-col_description__inner p,
    [data-theme="light"] #swagger-ui .swagger-ui .response-col_description p {
      color: #121820 !important;
    }
    [data-theme="light"] #swagger-ui {
      background: #ffffff;
    }
    [data-theme="light"] #swagger-ui .swagger-ui .btn.execute {
      color: #04120c !important;
    }
  </style>
</head>
<body class="layout-openapi" data-search-index="{{ '/search-data.json' | relative_url }}">
  {% include nav.html %}
  <main class="openapi-shell">
    <header class="openapi-intro">
      {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
      {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
      <div class="openapi-meta">
        <span>OpenAPI 3 · interactive Swagger UI</span>
        <a href="{{ '/assets/openapi.yaml' | relative_url }}">Download openapi.yaml</a>
        <a href="{{ '/reference/api/' | relative_url }}">HTTP API overview</a>
        <a href="https://github.com/cxdy/grain/blob/main/api/openapi.yaml">Source in repo</a>
      </div>
    </header>
    <div id="swagger-ui" aria-label="OpenAPI specification"></div>
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin="anonymous"></script>
  <script>
    (function () {
      var specUrl = {{ '/assets/openapi.yaml' | relative_url | jsonify }};
      function highlightTheme() {
        var t = document.documentElement.getAttribute('data-theme');
        // agate is dark-bg; idea is light-bg (readable on light panels)
        return t === 'light' ? 'idea' : 'agate';
      }
      window.addEventListener('DOMContentLoaded', function () {
        if (!window.SwaggerUIBundle) return;
        window.SwaggerUIBundle({
          url: specUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            window.SwaggerUIBundle.presets.apis,
            window.SwaggerUIStandalonePreset
          ],
          plugins: [window.SwaggerUIBundle.plugins.DownloadUrl],
          layout: 'StandaloneLayout',
          // Default servers are localhost / unix socket — try-it-out is for local daemons.
          tryItOutEnabled: true,
          persistAuthorization: true,
          displayRequestDuration: true,
          filter: true,
          syntaxHighlight: { activated: true, theme: highlightTheme() }
        });
      });
    })();
  </script>
</body>
</html>
